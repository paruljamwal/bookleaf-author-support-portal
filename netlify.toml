# Publishes the Vite app only. Leave the Netlify base directory empty.
# frontend/public/_redirects proxies /api to the Render API on the same site.
# Leave VITE_API_URL empty. An absolute API URL is ignored so cookies stay first-party.
# @bookleaf/shared must be built first because the frontend imports its dist output.
[build]
  command = "npm run build --workspace=@bookleaf/shared && npm run build --workspace=frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"
